version: '3'
services:
	app1:
		build:
			context: .
			dockerfile: sring2app1docker
		container_name: app1_container
		ports:
			- "8081:8080"
		depends_on:
			- app2_container
		networks:
			- internal-network
	app2:
		build:
			context: .
			dockerfile: sring2app2docker
		container_name: app2_container
		ports:
			- "8082:8080"
		networks:
			- internal-network
	networks:
		internal-network:
			driver: bridge